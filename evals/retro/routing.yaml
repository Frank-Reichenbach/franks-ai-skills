# Routing eval for retro.
cases:
  - prompt: "Let's do a retro on this session before we wrap up"
    expect_skill: retro
  - prompt: "Review this session and see if any skills need updating"
    expect_skill: retro
  - prompt: "That was painful, the deploy script broke three times. Let's wrap up."
    expect_skill: retro
    note: "A session with notable friction is wrapping up, which retro's description covers without an explicit request."
  - prompt: "Convert 100 Fahrenheit to Celsius"
    expect_skill: null
  - prompt: "Create a new skill for reviewing pull requests"
    expect_skill: skill-writing
