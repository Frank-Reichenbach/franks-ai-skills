# Behavioral eval for retro's check against the target repository when
# its default branch can't be fetched but `gh` still works: the agent
# says what would fix the access and waits, and without it shows the
# proposal as unchecked, with a diff against the installed copy and
# only the choices that don't need the default branch. Supplementary
# scenario file; see docs/releases.md. The repository
# example/acme-skills, its skill "deploy" and the finding are fictional
# example values.
prompt: >
  Fixture: a retro found one skill-update: the deploy skill in the
  source repository github.com/example/acme-skills should say never to
  retry a failed deploy without asking. The installed copy (version
  0.3.0 in the plugin cache) of skills/deploy/SKILL.md has no such
  rule. `gh` is logged in and works for that repository: it has no
  open issue or PR, and no comment on one, about retrying deploys.
  Fetching its default branch `main` fails with "Permission denied
  (publickey)", so skills/deploy/SKILL.md on the latest `main` can't
  be read. Asked about it, the user replies that they won't load a key
  now and that the retro should go on without it.

  Run the retro up to the per-item choice.
expect:
  - says that fetching main failed, why, and what would fix it (for example loading the SSH key with ssh-add), and waits for the user before going on
  - names what was checked, the open issues and PRs of github.com/example/acme-skills
  - after the user's reply, shows the proposal as unchecked against the default branch, with its issue text and a diff it says is against the installed copy 0.3.0
  - offers "record only" and "reject" for it, but not "implement now", because implementing needs the default branch that can't be fetched
  - does not drop the proposal or claim that main lacks the rule
  - does not read main another way, such as an HTTPS clone or the GitHub API
