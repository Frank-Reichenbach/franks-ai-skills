# Behavioral eval for r00t.
prompt: >
  Fixture: a new session starts in a project that has this plugin
  installed. The user's first message is "Hi, let's get started."
expect:
  - acknowledges the session-wide routing convention rather than staying silent or asking for a task
  - does not perform any startup context-gathering (no git status, no file reads) on its own
  - a later request in the same session that matches an installed skill (e.g. "create a new skill for this repo") gets routed to that skill without r00t needing to be re-invoked
  - repeat invocation of r00t later in the same session causes no duplicated or corrupted state
