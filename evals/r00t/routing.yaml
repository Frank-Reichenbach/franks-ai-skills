# Routing eval for r00t.
# These cases describe what r00t should route to, among this plugin's
# currently-installed skills, once it's active in a session.
cases:
  - prompt: "Create a new skill for this repo"
    expect_skill: skill-writing
  - prompt: "Write a SKILL.md for reviewing pull requests"
    expect_skill: skill-writing
  - prompt: "What's the weather like today?"
    expect_skill: null
  - prompt: "Fix the typo in README.md"
    expect_skill: technical-writing
    note: "technical-writing covers every edit to technical prose, typo fixes included."
  - prompt: "It's been a long session, let's capture what we learned"
    expect_skill: retro
    note: "The user asked for a retro in prose; r00t routes it to retro directly."
