# Behavioral eval for git-flow's "What a PR description covers" section,
# plus the squash-merge consequence for PR titles and the wrapping rule.
# Supplementary scenario file; see docs/releases.md.
prompt: >
  Fixture: a branch adds a caching layer, because repeated lookups made
  the order page slow. Getting there involved a scratch design note at
  docs/scratch/2026-01-caching-design.md and two discarded approaches
  (an LRU in-process cache, rejected because the service runs
  multi-replica; a write-through cache, rejected on invalidation
  complexity). The chosen approach is read-through with a 60s TTL. The
  branch adds 12 tests in tests/test_cache.py covering TTL expiry,
  fallthrough on a cache miss, and invalidation on write; `pytest -q`
  reported "214 passed, 0 failed in 8.31s". The repo squash-merges with
  the PR title and description as the commit message. You, Claude Opus
  5.5, wrote the change; no one reviewed it yet.

  Write the PR title and description.
expect:
  - gives the PR title a Conventional Commits type prefix, because the squash commit takes the PR title as its subject on main
  - opens with a summary that states the problem (slow order page) before what the change does about it
  - follows the default order of summary, changes, decisions, tests, then trailers, leaving out a section with nothing to say
  - describes what the branch adds to the repo, not the process that produced it
  - does not cite or link the scratch design note
  - records both rejected approaches together with the reason each was rejected
  - its tests section names the added tests and what they cover (TTL expiry, cache-miss fallthrough, invalidation on write) rather than announcing that the suite passed
  - contains no checklist or reviewer-only notes
  - writes each paragraph and list item as a single line, without hard wraps
  - 'ends the description with "Assisted-by: Claude Opus 5.5 (code generation)" as its final paragraph, with no email address, no footer and no other line after it'
  - adds no review trailer, since nobody has reviewed this change
