# Behavioral eval for git-flow's commit rules: body wrapping and the
# trailer block. Supplementary scenario file; see docs/releases.md.
prompt: >
  Fixture: on branch feature/add-cache you are committing the
  read-through cache (60s TTL) that replaces an in-process LRU cache,
  because the service runs with several replicas. Jane Doe
  <jane@example.com> reviewed this change and said it is ready to
  merge, John Roe <john@example.com>
  co-wrote it, and you, Claude Opus 5.5, wrote the code with them;
  nobody else was involved. The repo's recent commits end like this,
  with a blank line between the two trailers:

  "Reviewed-by: Jane Doe <jane@example.com>

  Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"

  Write the commit message.
expect:
  - uses a Conventional Commits subject with a type prefix and an imperative summary
  - explains in the body why the cache changed (several replicas), not only what changed
  - hard-wraps the body at about 72 columns
  - 'adds "Reviewed-by: Jane Doe <jane@example.com>" and "Co-authored-by: John Roe <john@example.com>", with email addresses, because they are people and Jane said the change is ready'
  - 'adds "Assisted-by: Claude Opus 5.5 (code generation)" for the model, without an email address'
  - does not copy the history's Co-Authored-By spelling or its Claude Sonnet 5 entry, since the trailer rules don't follow history
  - capitalizes only the first letter of each trailer key
  - adds no trailer for anyone the fixture doesn't name as involved in this change
  - puts all trailers in one final paragraph with no blank line between them, because git reads only the last paragraph as trailers
  - puts nothing after the trailers
