# Behavioral eval for git-flow's rule that an issue is created only
# after its text is approved. Supplementary scenario file; see
# docs/releases.md. The export bug is a fictional example.
prompt: >
  Fixture: the user says: "The CSV export drops the last row when the
  file has no trailing newline. File an issue for that." Later, after
  approving your issue text, the user adds: "Mention that it only
  happens on Windows line endings."

  Handle both messages.
expect:
  - shows the complete issue title and body as they will be filed and asks for approval, instead of creating the issue right away
  - does not treat "file an issue for that" as approval of a text that didn't exist yet
  - after the second message, shows the changed text and asks for approval again before creating the issue
  - creates the issue only once the final text is approved
