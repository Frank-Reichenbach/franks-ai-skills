# Catalog collision eval.
# Add cases here whose prompts sit near a description boundary between two
# skills, to catch routing ambiguity before it ships. Format:
#
# cases:
#   - prompt: "Review this REST API design for scalability"
#     expected: architecture-review
#     not_expected: [code-review]
#
# A case can also document an *intentional* overlap that is not a
# collision — r00t is invoked alongside using-superpowers
# (from the superpowers plugin) in the same session; both are expected to
# fire together, and this is cooperation, not a routing bug.
cases:
  - prompt: "starting a session in a project with both this plugin and superpowers installed"
    expected: r00t
    also_expected: [using-superpowers]
    note: "Both may fire together at the start of a session; this is expected cooperation, not a routing collision."
  - prompt: "Write documentation for this new skill, including its SKILL.md description"
    expected: skill-writing
    not_expected: [technical-writing]
    note: "Authoring a SKILL.md's own content is skill-writing's job (naming/description/structure rules); technical-writing governs general prose clarity and voice, not skill-authoring mechanics."
  - prompt: "Write a commit message for this change following our conventions"
    expected: git-flow
    also_expected: [technical-writing]
    note: "git-flow governs the commit's format/structure (type prefix, atomic scope); technical-writing governs the prose quality of its body. Both commonly apply together — intentional cooperation, not a collision to resolve to one skill."
  - prompt: "Commit this change with a proper conventional commit message"
    expected: git-flow
    also_expected: [shell]
    note: "git-flow decides the commit message's format/content; shell governs how the actual git commit command gets executed. Both commonly apply together — intentional cooperation, not a collision to resolve to one skill."
  - prompt: "Based on this retro, update the skill's SKILL.md with the proposed change"
    expected: retro
    also_expected: [skill-writing]
    note: "retro identifies what should change and drafts the proposal; skill-writing's naming/description/structure conventions still govern how the actual SKILL.md content is written. Both commonly apply together — intentional cooperation, not a collision to resolve to one skill."
  - prompt: "Write the title and body for the bug issue this retro proposes"
    expected: retro
    also_expected: [technical-writing]
    note: "retro decides what the issue is about and drafts it; technical-writing governs the prose quality of that title/body, the same as any other technical writing. Both commonly apply together — intentional cooperation, not a collision to resolve to one skill."
  - prompt: "Add this new skill and commit it"
    expected: skill-writing
    also_expected: [git-flow]
    note: "skill-writing decides the skill's own content and structure; git-flow governs the commit/PR that lands it, the same as any other change. Both commonly apply together — intentional cooperation, not a collision to resolve to one skill."
