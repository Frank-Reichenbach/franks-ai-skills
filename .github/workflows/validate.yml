name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run validation
        run: ./tools/validate.sh

      # run.sh's redact.awk has to work with every common awk: mawk is
      # Ubuntu's default, gawk the GNU one (BSD awk is macOS's, checked
      # locally).
      - name: Test the shell wrapper with mawk and gawk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mawk gawk
          for awk in mawk gawk; do
            shim=$(mktemp -d)
            ln -s "$(command -v "$awk")" "$shim/awk"
            echo "== $("$awk" -W version 2>&1 | head -n 1)"
            PATH="$shim:$PATH" python3 -m unittest tools.tests.test_shell_run
          done

  # run.sh also runs in Git Bash on Windows, the bash Claude Code uses
  # there. Git for Windows ships without iconv, so this job installs the
  # GNU libiconv build that `winget install --id mlocati.GetText` does,
  # from the same release's zip, pinned by checksum.
  shell-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      # The test runner's own console output; the tests set their
      # encodings themselves.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the scripts are checked out with LF line endings
        run: |
          if grep -l $'\r' skills/shell/scripts/*; then
            echo "CR line endings in the files above" >&2
            exit 1
          fi

      - name: Install iconv
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL -o "$tmp/gettext-iconv.zip" \
            https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.19/gettext1.0-iconv1.19-shared-64.zip
          echo "c2f195fc4ed3df4070fb08ff88c2f724afd1eed4e28f859efae1000bb7ba1152  $tmp/gettext-iconv.zip" | sha256sum -c -
          unzip -q "$tmp/gettext-iconv.zip" -d "$tmp/gettext-iconv"
          echo "ICONV_DIR=$tmp/gettext-iconv/bin" >> "$GITHUB_ENV"

      # The runner's Git Bash may bring its own iconv in /usr/bin, which
      # Git Bash puts ahead of PATH entries added through GITHUB_PATH; this
      # step puts the installed one first and checks it is the one used.
      - name: Test the shell wrapper in Git Bash
        run: |
          export PATH="$ICONV_DIR:$PATH"
          test "$(command -v iconv)" = "$ICONV_DIR/iconv"
          python -c "import shutil, subprocess; b = shutil.which('bash'); print('tests start', b, 'OSTYPE=' + subprocess.run([b, '-c', 'echo \$OSTYPE'], capture_output=True, text=True).stdout.strip())"
          python -m unittest tools.tests.test_shell_run
